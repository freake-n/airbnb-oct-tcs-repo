name: dbt_databricks_production

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:00 UTC (07:30 IST); GitHub may delay scheduled runs.
    - cron: "0 2 * * *"

jobs:
  dbt_databricks_production:
    name: Build Airbnb dbt project on Databricks
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DBT_PROFILES_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt Databricks adapter
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-databricks==1.9.0"

      - name: Check dbt version
        run: dbt --version

      - name: Install dbt packages
        run: dbt deps

      - name: Validate Databricks connection
        run: dbt debug --target prod

      - name: Build models and run tests
        run: dbt build --target prod
